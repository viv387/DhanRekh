name: Money Ledger CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Lint, Test & Build Production Container
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: money_ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Set Working Directory Path
        id: set-dir
        run: |
          if [ -d "my-app" ]; then
            echo "APP_DIR=my-app" >> $GITHUB_ENV
          else
            echo "APP_DIR=." >> $GITHUB_ENV
          fi

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ env.APP_DIR }}

      - name: Generate Prisma Client
        run: pnpm exec prisma generate
        working-directory: ${{ env.APP_DIR }}

      - name: Run ESLint
        run: pnpm run lint
        working-directory: ${{ env.APP_DIR }}

      - name: Run TypeScript Type Check
        run: pnpm exec tsc --noEmit
        working-directory: ${{ env.APP_DIR }}

      - name: Push Database Schema to Test Database
        run: pnpm exec prisma db push
        working-directory: ${{ env.APP_DIR }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/money_ledger_test?schema=public

      - name: Run Unit & Integration Test Suites
        run: pnpm test
        working-directory: ${{ env.APP_DIR }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/money_ledger_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-test-access-secret-32-bytes!
          JWT_REFRESH_SECRET: ci-test-refresh-secret-32-bytes!

      - name: Build Next.js Application
        run: pnpm run build
        working-directory: ${{ env.APP_DIR }}

      - name: Validate Docker Image Build
        run: docker build -t money-ledger:latest .
        working-directory: ${{ env.APP_DIR }}
