# ============================================================
# render.yaml — Render Infrastructure as Code
# Defines PostgreSQL, Redis, Next.js App, and Worker services
# Docs: https://render.com/docs/yaml-spec
# ============================================================

databases:
  # --- PostgreSQL 16 ---
  - name: money-ledger-postgres
    databaseName: money_ledger
    user: money_ledger_user
    plan: free          # free | starter | standard | pro
    region: oregon      # oregon | frankfurt | singapore | ohio
    postgresMajorVersion: "16"

services:
  # --- Redis ---
  - type: redis
    name: money-ledger-redis
    plan: free          # free | starter | standard
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []     # Only internal Render services can connect

  # --- Next.js Web Application ---
  - type: web
    name: money-ledger-app
    runtime: node
    region: oregon
    plan: free          # free | starter | standard | pro
    branch: main

    # Build settings
    buildCommand: pnpm install --frozen-lockfile && npx prisma generate && pnpm run build
    startCommand: pnpm run start

    # Health check
    healthCheckPath: /api/health

    # Environment variables
    envVars:
      # Database — auto-populated from Render PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: money-ledger-postgres
          property: connectionString

      # Redis — auto-populated from Render Redis
      - key: REDIS_URL
        fromService:
          type: redis
          name: money-ledger-redis
          property: connectionString

      # Node environment
      - key: NODE_ENV
        value: production

      # JWT Secrets — set these manually in Render dashboard!
      - key: JWT_ACCESS_SECRET
        generateValue: true   # Render auto-generates a secure random value
      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: JWT_ACCESS_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      - key: BCRYPT_ROUNDS
        value: "10"

      # Rate Limiting
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: TRANSFER_RATE_LIMIT
        value: "5"
      - key: MONEY_MOVEMENT_RATE_LIMIT
        value: "30"

      # Kafka (leave empty for free-tier deployment without Kafka)
      - key: KAFKA_BROKERS
        value: ""
      - key: KAFKA_CLIENT_ID
        value: "money-ledger"

      # SMTP Email (optional)
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"

  # --- Background Worker Service (requires paid plan) ---
  - type: worker
    name: money-ledger-workers
    runtime: node
    region: oregon
    plan: starter       # worker requires starter or above
    branch: main

    buildCommand: pnpm install --frozen-lockfile && npx prisma generate
    startCommand: pnpm run workers

    envVars:
      # Database
      - key: DATABASE_URL
        fromDatabase:
          name: money-ledger-postgres
          property: connectionString

      # Redis
      - key: REDIS_URL
        fromService:
          type: redis
          name: money-ledger-redis
          property: connectionString

      - key: NODE_ENV
        value: production

      # Must match app service secrets
      - key: JWT_ACCESS_SECRET
        fromService:
          type: web
          name: money-ledger-app
          envVarKey: JWT_ACCESS_SECRET
      - key: JWT_REFRESH_SECRET
        fromService:
          type: web
          name: money-ledger-app
          envVarKey: JWT_REFRESH_SECRET

      - key: KAFKA_BROKERS
        value: ""
      - key: KAFKA_CLIENT_ID
        value: "money-ledger"
